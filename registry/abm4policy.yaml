notes: |
  Research-program / community-of-practice label, not a single
  packaged toolkit. Refers to the network of central-bank-affiliated
  agent-based modeling efforts focused on macroprudential policy,
  financial stability, and systemic risk. The ABM4Policy workshop
  series (most recently hosted by the ECB in June 2025) is the
  visible community gathering point.

  Jagoda Kaszowska-Mojsa is the CEF 2026 invitee representing this
  cluster. Her own MACROPRU project (H2020 Marie Skłodowska-Curie
  Fellowship at Oxford) used agent-based simulation to study
  distributional effects of macroprudential policy. She is a
  co-author on Borsos, Carro, Glielmo, Hinterschweiger,
  Kaszowska-Mojsa, Uluc, "Agent-based modeling at central banks:
  recent developments and new challenges" (Bank of England Working
  Paper No. 1122, 2025) — a multi-central-bank survey of the field.

  No single packaged tool, license, repository, or platform exists
  for "ABM4Policy". Individual central-bank ABMs (Bank of England,
  Banco de España, Banca d'Italia, Magyar Nemzeti Bank, Narodowy
  Bank Polski) are largely internal or paper-by-paper releases.
  This entry's confidence reflects that ambiguity.
