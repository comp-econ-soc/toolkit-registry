notes: |
  ACE — Agent-based Computational Economics — is the long-running
  research-program label coined and curated by Leigh Tesfatsion
  (Iowa State, Professor Emerita) since the late 1990s. The site
  at econ.iastate.edu/tesfatsi/ace.htm functions as a central
  community hub: surveys and introductory materials, an annotated
  syllabus, software/toolkit pointers, teaching resources,
  journals, and a directory of ACE researchers and groups.

  This is a research-program / educational-resource entry, not a
  packaged toolkit. The site itself is a curated link collection;
  the underlying ACE research uses many different platforms
  (NetLogo, Repast, Mesa, custom code, etc.). Tesfatsion's own
  applied work focuses on electricity market design and network
  economics (e.g., the AMES wholesale-power test bed).

  Site last updated 2026-04-21 (per page footer).

