notes: |
  AGENTBLOCKS is an open-access community platform for sharing,
  comparing, peer-reviewing, and reusing modular code components
  ("Reusable Building Blocks", RBBs) for agent-based models. Hosted
  by TU Delft and 4TU; supported in part by an ERC grant. Intended
  as a discipline-agnostic library serving ecology, economics,
  sociology, psychology, and other ABM-using fields.

  The platform was launched alongside a 2025 JASSS paper (Filatova
  et al., JASSS 28(4): 11) describing the design and a first set of
  peer-reviewed RBBs. As of the JASSS publication, eight RBBs were
  peer-reviewed and 10+ were under development.

  License: not stated on the platform homepage as of 2026-05-04.
  Source code repository: not publicly listed.

