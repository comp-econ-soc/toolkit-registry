notes: |
  Julia toolbox for Bayesian estimation of medium-scale heterogeneous-agent
  DSGE (HANK) models in the spirit of Bayer, Born & Luetticke (2024,
  "Shocks, Frictions, and Inequality in US Business Cycles," AER 114(5),
  1211–47).

  Implements Reiter (2009)-style linearization with Bayesian-prior-based
  dimensionality reduction of the cross-sectional histogram, Kalman
  filtering, and impulse-response matching. Ships with HANK-1-asset,
  HANK-2-asset, RANK, and Krusell-Smith templates.

  Methodological strength is *estimation*, not just solution — distinguishes
  it from pure SSJ workflows. Companion to Bayer-Luetticke 2018+ research
  program.
