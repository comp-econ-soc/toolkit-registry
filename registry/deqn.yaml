notes: |
  Deep Equilibrium Nets (DEQN) is a method (with reference codebase)
  for globally solving high-dimensional dynamic stochastic economic
  models using deep neural networks to approximate equilibrium
  policy functions. It is not a packaged framework — the GitHub
  repository serves as the canonical reference implementation.

  Reference paper:
    Azinovic, M., Gaegauf, L., and Scheidegger, S. (2022).
    "Deep Equilibrium Nets." International Economic Review, 63(4),
    1471–1525.

  Distinguishing feature: trains the network to satisfy the model's
  equilibrium conditions directly (residual minimization on Euler /
  market-clearing equations), without requiring value-function or
  expectation approximation. Demonstrated on heterogeneous-agent
  models with many idiosyncratic shocks.

