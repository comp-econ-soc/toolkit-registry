notes: |
  Dolo describes discrete-time recursive economic models in YAML and solves
  them with a wide algorithmic menu: perturbation through 3rd order, time
  iteration, improved time iteration (Winant's Newton-accelerated variant),
  endogenous grid method (Carroll), value iteration, and perfect-foresight
  stacked-time. Single-economy DTCC paradigm.

  Sister project `dolark` (https://github.com/EconForge/dolark) layers
  heterogeneous-agent capability on top: Aiyagari-style stationary
  equilibria with idiosyncratic shocks, Reiter-style perturbation around
  the stationary distribution, and a Krusell-Smith dimension-reduction
  route. Self-described as "experimental"; effectively dormant since
  Apr 2023 (PRs from 2019-2022 still open).

  Dolo.py is in maintenance mode (last release Nov 2024, mostly housekeeping
  for pandas/numpy 2.0 compat). Active development has shifted toward
  Dolo.jl (Oct 2025 commits) and a newer Python project, dyno.py
  (active through Apr 2026).

  Detailed capabilities note: `McKibbin-Software-Group/research/dolo-capabilities.md`.

