notes: |
  Research-program label, not a single packaged toolkit. The
  "Dosi-group lineage" refers to the family of evolutionary,
  agent-based macro models developed at the Laboratory of
  Economics and Management (LEM), Institute of Economics, Scuola
  Superiore Sant'Anna, Pisa. The flagship is the Keynes+Schumpeter
  (K+S) model (Dosi, Fagiolo, Roventini, J. Econ. Dynamics & Control
  2010), with extensions including Schumpeter meeting Keynes (DSK)
  agent-based integrated assessment models for climate-economy
  analysis.

  Tania Treibich (Maastricht; LEM affiliate) is the CEF 2026
  pre-conference invitee representing this lineage. Her co-authored
  K+S work (with Dosi, Napoletano, Roventini, Stiglitz) is the
  most visible recent extension of the program.

  No central single-toolkit website or repository: code is typically
  released paper-by-paper. License/language vary per implementation.

