notes: |
  Founded by Michel Juillard in 1994. CEPREMAP-based core team plus
  external contributors. Self-hosted GitLab (not GitHub) at
  git.dynare.org. Annual masterclasses at ENS Paris.

  Dynare 7.0 (released 2026-03-19) introduced native heterogeneous-agent
  support via `heterogeneity_dimension` blocks, a sequence-space "fake-news"
  algorithm based on Auclert-Bardóczy-Rognlie-Straub (2021) plus Bhandari
  et al. (2023), and bundled examples for Krusell-Smith and one/two-asset
  HANK. Dynare 6.x had no native HA. The 6.x line remains in maintenance
  (6.5 released 2025-11-24).

  Octave 11.x with the optim package supports the full 7.0 HA framework.
  Dynare.jl (Julia rewrite) does NOT yet ship the heterogeneity framework
  as of v0.10.4 (2025-10-16).

  Detailed capabilities note: `McKibbin-Software-Group/research/dynare-capabilities.md`.

