notes: |
  Two related-but-distinct artefacts:

  1. FLAME (Flexible Large-scale Agent Modelling Environment) — a
     general-purpose agent-based modeling framework developed at the
     University of Sheffield. Agents are specified as state machines
     in XML; the framework generates C/C++ simulation code. FLAME-GPU
     extends this to massively parallel GPU execution.

  2. Eurace / Eurace@Unibi — a large-scale agent-based macroeconomic
     model of the European economy, originally built on the FLAME
     framework. Maintained by the ETACE group at Bielefeld University
     under Herbert Dawid. Used for policy analysis (labor markets,
     monetary/fiscal policy, technology diffusion, climate policy).

  These are bundled in this registry entry because the SCE relationship
  is via Dawid presenting the Eurace research program, which is
  inseparable from its FLAME tooling foundation. Licenses vary by
  component (FLAME is open-source; some Eurace@Unibi modules are
  release-on-request).

