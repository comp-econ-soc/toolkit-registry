notes: |
  GDSGE is a MATLAB/C++ toolbox for global solutions of nonlinear DSGE
  models. Users define a model in a compact `.gmod` file (Dynare-like
  syntax); the toolbox parses it and generates C++ dynamic libraries that
  implement the Simultaneous Transition and Policy Function Iteration
  (STPFI) algorithm. Best suited to models with a finite (not continuum)
  number of agent types but rich nonlinearities — financial-crisis models,
  rare-disaster models, models with implicit laws of motion. Less natural
  for continuum-Aiyagari problems.

  Reference paper: Cao, Luo, & Nie (2023), "Global DSGE Models," *Review of
  Economic Dynamics*. The toolbox depends on third-party libraries
  (Adept for AD, CoDoSol solver, Eigen for linear algebra), each with their
  own licenses.

