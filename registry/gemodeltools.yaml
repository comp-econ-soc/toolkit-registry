notes: |
  GEModelTools is a Python library for solving general-equilibrium HA
  models, building on the sequence-space Jacobian (SSJ) methodology of
  Auclert, Bardóczy, Rognlie & Straub (2021). It pairs with the sister
  package **ConSav** (https://github.com/NumEconCopenhagen/ConsumptionSaving;
  PyPI: `ConSav`, license: MIT, latest v0.12 on 2024-09-27), which provides
  consumption-saving primitives (Numba-JIT EGM, upper-envelope, Newton /
  golden-section, multi-linear interpolation). Both packages are part of
  the NumEconCopenhagen umbrella (University of Copenhagen).

  Druedahl is Assistant Professor at the University of Copenhagen's CEBI
  group. Companion notebooks: `ConsumptionSavingNotebooks` and
  `GEModelToolsNotebooks` — the latter contains canonical HA examples
  (Aiyagari, Krusell-Smith, one-asset HANK, two-asset HANK).

