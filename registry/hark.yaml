notes: |
  HARK ("Heterogeneous Agents Resources & toolKit") is the code toolkit at
  the heart of the Econ-ARK project. NumFOCUS-sponsored open-source Python
  framework built around the `AgentType` abstraction: an `AgentType` solves
  a household problem; collections of agent types interact in a `Market`.
  EGM (Carroll 2006) is the workhorse solver.

  Native handling: buffer-stock, life-cycle, multi-type Aiyagari-style
  economies, portfolio choice, discrete-continuous choice. Integrates with
  Sequence-Space Jacobian for HANK-style counterfactuals via the `HARK.HANK`
  interface and an SSJ shim.

  Used by Federal Reserve Board, IMF, Bank of England, and academic
  researchers. The Econ-ARK ecosystem also includes: DemARK
  (demonstrations), REMARK (paper replications), and emerging projects
  Matsya (DP theory copilot) and DolARK / dolo-plus (DDSL successor
  language).

  Citation: Carroll, Kaufman, Kazil, Palmer & White (2018), "The Econ-ARK
  and HARK: Open Source Tools for Computational Economics," SciPy
  Proceedings.
