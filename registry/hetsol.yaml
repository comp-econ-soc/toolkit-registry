notes: |
  "HetSol" is the SCE registry's working slug for Michael Reiter's MATLAB
  implementations of the linearization-around-stationary-distribution method
  introduced in Reiter (2009), "Solving heterogeneous-agent models by
  projection and perturbation," JEDC 33(3), 649–665. The code is distributed
  from Reiter's IHS Vienna research page as two tarballs:
    - nlaa.tar.gz       — Nonlinear Solution by Approximate Aggregation (v0.11)
    - appraggr.tar.gz   — Approximate and Almost-Exact Aggregation (v0.20)
  There is no GitHub repository, no LICENSE file, and no formal release
  cadence; the code accompanies Reiter's papers and short courses (e.g. the
  Berlin School of Economics short course on "Heterogeneous Agent Models in
  Macroeconomics"). The Reiter (2009) method is the methodological foundation
  of every modern "linearized HANK" implementation, including BBL's
  BASEforHANK toolbox (which is in the registry as `baseforhank`).

  Reiter is the head of the "Macroeconomics and Business Cycles" research
  group at IHS Vienna. The CEF 2026 invitation listed him as both a
  pre-conference invitee and the JEDC-sponsored plenary speaker; he is the
  natural Session B presenter for the "Reiter linearization" lineage.

