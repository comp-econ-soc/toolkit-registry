notes: |
  Research program (not a packaged toolkit) on using deep learning and
  neural networks to solve high-dimensional dynamic economic models.
  Key contributions include:
    - Maliar, Maliar, Winant (2021, JME) "Deep learning for solving
      dynamic economic models"
    - All-in-one expectation operator framework
    - Application to heterogeneous-agent and OLG models with many
      state variables that defeat traditional grid methods
  Code is typically released as paper-replication packages on the
  authors' homepages rather than a single named library. Landing
  page is Lilia Maliar's CUNY academic homepage.

