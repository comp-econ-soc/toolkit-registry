notes: |
  Research-program label, not a single packaged toolkit. Antoine
  Mandel's ABM-related research spans production networks,
  systemic risk in financial networks, and climate-finance stress
  testing. His own homepage advertises a "Software/Code" section
  but does not name a single flagship platform; code releases
  appear to be paper-specific.

  Major projects associated with this program include GREENWIN,
  DOLFINS (H2020), SIMPOL (FP7) on systemic importance in climate
  financial networks, and IMPRESSIONS (FP7) on high-end climate
  scenarios. Methodologically these draw on agent-based models of
  production-network formation, heterogeneous-agent financial
  models, and complex-network systemic-risk analysis.

  Affiliation: Mandel is at Université Paris 1 Panthéon-Sorbonne /
  Centre d'Economie de la Sorbonne. He is referred to in the CEF
  shortlist as "Paris School of Economics" — that association is
  via PSE's broader research community rather than a primary PSE
  faculty appointment, so far as I can verify from his CV.

  License/language vary per implementation; no single toolkit URL.
