notes: |-
  Matsya is a CLI and Python API for a research RAG (retrieval-augmented
  generation) oracle that acts as a "mathematical and theoretical copilot
  for modular dynamic programming problems." It performs one-to-one
  translations between dolo-plus YAML syntax and formal modular Bellman
  notation, analyzing paper excerpts to identify states, controls, shocks,
  and timing.

  Hosted under the Econ-ARK org (https://github.com/econ-ark/matsya).
  Designed to be called as a specialist consultant from local coding
  agents (Claude Code, Cursor, etc.) — handling DP theory while local
  agents manage implementation.

  Knowledge base covers: dolo-plus syntax and specification, dynamic
  programming theory, category-theoretic foundations of modular DP, and
  canonical examples. Long-run Econ-ARK plan: all HARK models described
  by a Dolo-descendant language (working prototype name "DolARK"); Matsya
  is the bridge between informal model statements and that DDSL.

  At CEF 2026 Session A (DDSL), Matsya plays a dual role: presents one
  canonical model on its own behalf, and serves as the lingua-franca
  translator that digests each other DDSL toolkit's canonical model into
  the dolo-plus DDSL.

  License note (2026-05-04): Apache-2.0 LICENSE file added to econ-ark/matsya matching HARK's existing LICENSE byte-for-byte (commit 5cbf8e6 to econ-ark/matsya). Prior registry state recorded license as 'unspecified' because no LICENSE file existed in the repo at population time.
