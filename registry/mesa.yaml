notes: |
  Mesa is the most widely used open-source Python framework for
  agent-based modeling. Originally created by Jackie Kazil and
  David Masad in 2015 to fill the gap left by the absence of a
  Python-native ABM library; now community-developed with 70+
  contributors. Apache-2.0 licensed, hosted on GitHub at
  projectmesa/mesa.

  Current stable release: 3.5.1 (2026-03-15). Mesa 4 is in active
  development with pre-releases available. Mesa 3 was published in
  the Journal of Open Source Software in 2025 (ter Hoeven, Kwakkel,
  Hess, Pike, Wang, rht, Kazil — JOSS 10.21105/joss.07668).

  The maintainer list above is reconstructed from the JOSS Mesa 3
  paper authorship plus public project history; the GitHub
  repository does not publish a single canonical maintainer list,
  so affiliations beyond Kazil and Kwakkel are inferred from
  publicly visible ties and may be incomplete.
