notes: |
  QuantEcon is an open-source organization providing high-quality
  computational tools and lectures for quantitative economics. It
  comprises:
    - QuantEcon.py — Python library for economic modeling
    - QuantEcon.jl — Julia library mirroring the Python package
    - QuantEcon Lectures — extensive open-access lecture series
      (Python and Julia versions) co-authored by Sargent and Stachurski
  Sponsored by the Alfred P. Sloan Foundation and others; team based
  primarily at NYU (Sargent) and ANU (Stachurski, McKay).

