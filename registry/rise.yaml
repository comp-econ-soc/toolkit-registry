notes: |-
  RISE (Rationality In Switching Environments) is an object-oriented MATLAB
  toolbox for modelling regime-switching DSGE models, supporting both
  exogenous and endogenous switching mechanisms as well as constant-
  parameter (standard) DSGE models. Capabilities include perturbation
  solutions up to 5th order, regime-switching VAR / DSGE-VAR estimation,
  Bayesian and maximum-likelihood estimation, uncertainty quantification,
  and a suite of global optimization algorithms. Roughly the regime-
  switching counterpart to Dynare in spirit, though independently developed.

