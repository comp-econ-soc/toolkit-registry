notes: |
  Research program (not a packaged toolkit) covering computational
  methods Rust has developed for solving and estimating dynamic
  programming models and structural econometric models. Foundational
  contributions include:
    - Rust (1987, Econometrica) "Optimal Replacement of GMC Bus
      Engines" — introduced the Nested Fixed-Point (NFXP) algorithm
      for estimating dynamic discrete-choice models
    - Random-grid / successive-approximation methods for solving
      high-dimensional DPs (Rust 1997)
    - Curse-of-dimensionality breaking via random Bellman operators
  Code is typically released as paper-replication packages (often in
  GAUSS or Fortran) on Rust's homepage at editorialexpress.com.
  Georgetown faculty page lists him as Professor Emeritus.

