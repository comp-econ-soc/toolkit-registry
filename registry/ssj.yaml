notes: |
  Reference Python implementation of Auclert, Bardóczy, Rognlie & Straub
  (2021, "Using the Sequence-Space Jacobian to Solve and Estimate
  Heterogeneous-Agent Models," Econometrica 89(5), 2375–2408).

  Core abstraction: the sequence-space Jacobian J — derivative, around the
  stationary equilibrium, of the mapping from input sequences {X_t} to
  output sequences {Y_t}. Each model "block" carries its own Jacobian;
  blocks compose via chain rule; equilibrium is a sparse linear system in
  T × n unknowns. Block primitives: `HetBlock` (household with idiosyncratic
  shocks, EGM-solved), `SimpleBlock`, `SolvedBlock`.

  SSJ has become the lingua franca for HANK estimation and counterfactuals.
  Reference notebooks ship for Aiyagari, Krusell-Smith, one-asset HANK,
  and two-asset HANK.

  The broader SSJ orbit spans Auclert, Bardóczy, Rognlie, Straub (founders)
  plus an active extension community (e.g. EconPizza by Boehl applying SSJ
  with JAX-based automatic differentiation for nonlinear transitions).

