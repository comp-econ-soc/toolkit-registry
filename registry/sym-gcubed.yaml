notes: |
  G-Cubed is a multi-region multi-sector intertemporal general equilibrium
  model of the world economy (up to 23 regions / 22 sectors in production
  variants). Bridges econometric CGE and modern macroeconomics: Blanchard-
  Yaari + rule-of-thumb consumers, KLEM production nesting, sticky prices,
  bilateral trade, currency/asset accounting, deterministic perfect-foresight
  transition paths solved via the McKibbin (1986) two-point boundary value
  algorithm (a.k.a. "Warwick's algorithm" / MSG).

  SYM is the set-driven matrix language used to specify G-Cubed models —
  declarative, with conformability rules enforced at compile time. The
  legacy SYM is a C/yacc parser (Wilcoxen's BSD-licensed upstream); a
  Python rewrite called Symphony is in active development (AST stage as
  of 2025-12-16).

  License nuance: the SYM frontend (Wilcoxen upstream) is BSD; the McKibbin
  Software Group fork has no LICENSE file. The G-Cubed numerical core ships
  as a byte-compiled Python wheel (closed-source, McKibbin Software Group),
  fetched at runtime via `gcubed-build-switcher`. Effectively the public
  SYM material is a read-only spec without a working solver. License here
  is recorded as "proprietary" reflecting the binding numerical core; the
  parser is BSD-Wilcoxen-derived.

  No HA capability in the modern (Aiyagari/Krusell-Smith/HANK) sense — the
  closest is the aggregate Campbell-Mankiw two-type mix. The MSG saddle-path
  solver is structurally incompatible with Bewley-style cross-sectional
  distributions.

  Detailed capabilities note: `McKibbin-Software-Group/research/gcubed-capabilities.md`.

