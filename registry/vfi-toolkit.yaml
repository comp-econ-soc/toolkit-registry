notes: |
  VFI Toolkit is a MATLAB framework that automates value-function iteration
  on GPUs, returning value and policy functions for a wide range of
  macroeconomic models. Capabilities include finite- and infinite-horizon
  problems, heterogeneous-agent stationary distributions, general
  equilibrium for HA and OLG models, transition paths, panel-data simulation,
  and life-cycle profiling. Latest tagged release on GitHub at registry-
  population time was v2.3.0 (2025-02-19); the website references newer
  v2.5 development (InfHorz line). Documentation, examples, and a Discourse
  community forum are hosted at vfitoolkit.com.

  Robert Kirkby is a Senior Lecturer / macroeconomist at Victoria University
  of Wellington (NZ).

